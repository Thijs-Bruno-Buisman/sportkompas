<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emerald-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Volledige rechthoek voor maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg-mask)" />

  <!-- Binnen 80% safe zone cirkel (straal 150) -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#emerald-mask)" stroke-width="12" stroke-dasharray="100 35 70 35" stroke-linecap="round" />

  <line x1="256" y1="126" x2="256" y2="142" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
  <line x1="386" y1="256" x2="370" y2="256" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="386" x2="256" y2="370" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <line x1="126" y1="256" x2="142" y2="256" stroke="#64748b" stroke-width="5" stroke-linecap="round" />

  <polygon points="256,152 284,256 256,240" fill="url(#emerald-mask)" />
  <polygon points="256,152 228,256 256,240" fill="#059669" />
  <polygon points="256,360 284,256 256,272" fill="#475569" />
  <polygon points="256,360 228,256 256,272" fill="#334155" />

  <circle cx="256" cy="256" r="18" fill="#0f172a" stroke="url(#emerald-mask)" stroke-width="6" />
  <circle cx="256" cy="256" r="7" fill="#10b981" />
</svg>
